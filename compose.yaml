name: rox

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rox}
    # Localhost only: the database is never reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    # Named volume: survives container rebuilds and `docker compose down`.
    volumes:
      - rox_pgdata:/var/lib/postgresql/data
    # Log any query slower than 250 ms so latency problems are visible.
    command: ["postgres", "-c", "log_min_duration_statement=250"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rox_pgdata:
