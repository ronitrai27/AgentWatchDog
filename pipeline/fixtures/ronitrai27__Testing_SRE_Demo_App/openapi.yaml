openapi: 3.1.0
info:
  title: Saltmarket API
  version: 0.1.0
  description: >
    Written for Rox Lab from apps/api/src (routes) and packages/contracts (request and response
    shapes). Every error is RFC 9457 problem details.
servers:
  - url: http://api:4100
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sm_session
  schemas:
    Category:
      type: string
      enum: [visibility, warmth, eyewear, shore]
    Slug:
      type: string
      maxLength: 80
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    Cents:
      type: integer
      minimum: 0
    Product:
      type: object
      required: [id, slug, name, description, category, priceCents, stock]
      properties:
        id: { type: integer, minimum: 1 }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        priceCents: { $ref: "#/components/schemas/Cents" }
        stock: { type: integer }
    ProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        nextCursor: { type: [integer, "null"] }
    ProductCreate:
      type: object
      additionalProperties: false
      required: [slug, name, category, priceCents, stock]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        category: { $ref: "#/components/schemas/Category" }
        priceCents: { $ref: "#/components/schemas/Cents" }
        stock: { type: integer, minimum: 0 }
    ProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        category: { $ref: "#/components/schemas/Category" }
        priceCents: { $ref: "#/components/schemas/Cents" }
        stock: { type: integer, minimum: 0 }
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer, minimum: 1 }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [customer, admin] }
    Registration:
      type: object
      additionalProperties: false
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 10, maxLength: 200 }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
  responses:
    BadRequest:
      description: The request is not valid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: Sign in first
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Not allowed for this user
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Already exists
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The body is larger than 100 kB
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: The API and its database answer
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /v1/users:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /v1/sessions:
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /v1/sessions/current:
    delete:
      operationId: signOut
      responses:
        "204":
          description: Signed out (also when there was no session)
  /v1/me:
    get:
      operationId: me
      security:
        - session: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/products:
    get:
      operationId: listProducts
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: One page of products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createProduct
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /v1/products/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProduct
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProduct
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      operationId: archiveProduct
      security:
        - session: []
      responses:
        "204":
          description: Archived
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
